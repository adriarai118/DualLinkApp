name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ---- Xray bridge (Go -> Android AAR). Cached until xraybridge/ changes.
      - name: Cache Xray bridge AAR
        id: xray-cache
        uses: actions/cache@v4
        with:
          path: app/libs/xraybridge.aar
          key: xraybridge-v1-${{ hashFiles('xraybridge/**') }}

      - name: Set up Go
        if: steps.xray-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: xraybridge/go.mod
          cache-dependency-path: xraybridge/go.sum

      - name: Build Xray bridge AAR
        if: steps.xray-cache.outputs.cache-hit != 'true'
        working-directory: xraybridge
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          go mod tidy
          mkdir -p ../app/libs
          gomobile bind -v -target=android/arm64,android/arm -androidapi 24 -trimpath \
            -ldflags='-s -w -buildid= -checklinkname=0' \
            -o ../app/libs/xraybridge.aar .
          ls -la ../app/libs

      # ---- App
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk DualLink.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DualLink-debug-apk
          path: DualLink.apk

      - name: Publish to the "latest" release (direct download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DualLink.apk --title "DualLink Downloader (latest build)" --notes "Built from ${GITHUB_SHA::7}"
